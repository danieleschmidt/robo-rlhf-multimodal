apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: robo-rlhf-multimodal
    env: development
    version: 1.0.0
  name: robo-rlhf-development
spec:
  replicas: 1
  selector:
    matchLabels:
      app: robo-rlhf-multimodal
      env: development
  template:
    metadata:
      labels:
        app: robo-rlhf-multimodal
        env: development
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: development
        - name: LOG_LEVEL
          value: INFO
        image: robo-rlhf:latest-development
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
        name: robo-rlhf
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 1Gi
