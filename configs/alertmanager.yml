# Alertmanager configuration for Robo-RLHF-Multimodal
global:
  # Global SMTP configuration
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alerts@robo-rlhf.com'
  smtp_auth_username: 'alerts@robo-rlhf.com'
  smtp_auth_password: 'password'  # Use secrets in production
  
  # Global Slack configuration
  slack_api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'

# Inhibition rules to suppress redundant alerts
inhibit_rules:
  # Suppress noise when entire service is down
  - source_match:
      alertname: 'ApplicationDown'
    target_match_re:
      service: 'robo-rlhf'
    equal: ['instance']

  # Suppress individual component alerts when system is down
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['instance', 'service']

  # Suppress memory alerts when disk is full (likely related)
  - source_match:
      alertname: 'LowDiskSpace'
    target_match:
      alertname: 'HighMemoryUsage'
    equal: ['instance']

# Routing configuration
route:
  # Root route - all alerts start here
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s        # Wait for more alerts before sending notification
  group_interval: 5m     # Wait between sending notifications for the same group
  repeat_interval: 4h    # Wait before re-sending the same alert
  
  # Child routes for specific alert types
  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 30m
      continue: true  # Also send to default receiver
      
    # Training-specific alerts
    - match:
        service: training
      receiver: 'training-team'
      group_by: ['alertname', 'model_id']
      group_wait: 15s
      group_interval: 2m
      
    # Database alerts
    - match:
        service: database
      receiver: 'infrastructure-team'
      group_wait: 30s
      group_interval: 5m
      
    # Security alerts - immediate notification
    - match:
        service: security
      receiver: 'security-team'
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 15m
      
    # Autonomous SDLC alerts
    - match:
        service: autonomous-sdlc
      receiver: 'sdlc-team'
      group_by: ['alertname', 'phase']
      group_wait: 20s
      group_interval: 3m
      
    # Warning alerts - less frequent notifications
    - match:
        severity: warning
      receiver: 'warning-alerts'
      group_wait: 2m
      group_interval: 10m
      repeat_interval: 12h

# Notification receivers
receivers:
  # Default receiver - basic notifications
  - name: 'default'
    email_configs:
    - to: 'admin@robo-rlhf.com'
      subject: '[Robo-RLHF] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      body: |
        {{ range .Alerts }}
        Alert: {{ .Annotations.summary }}
        Description: {{ .Annotations.description }}
        Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
        Started: {{ .StartsAt }}
        {{ if .Annotations.runbook_url }}Runbook: {{ .Annotations.runbook_url }}{{ end }}
        {{ end }}
        
        Dashboard: http://grafana:3000/d/robo-rlhf-overview
        
  # Critical alerts - multiple notification channels
  - name: 'critical-alerts'
    email_configs:
    - to: 'admin@robo-rlhf.com,oncall@robo-rlhf.com'
      subject: '[CRITICAL] Robo-RLHF Alert - {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      headers:
        Priority: 'high'
      body: |
        🚨 CRITICAL ALERT 🚨
        
        {{ range .Alerts }}
        Summary: {{ .Annotations.summary }}
        Description: {{ .Annotations.description }}
        
        Service: {{ .Labels.service }}
        Instance: {{ .Labels.instance }}
        Started: {{ .StartsAt }}
        
        {{ if .Annotations.runbook_url }}📖 Runbook: {{ .Annotations.runbook_url }}{{ end }}
        {{ end }}
        
        🔗 Dashboard: http://grafana:3000/d/robo-rlhf-overview
        
    slack_configs:
    - channel: '#critical-alerts'
      title: 'Critical Alert - Robo-RLHF'
      color: 'danger'
      text: |
        {{ range .Alerts }}
        *{{ .Annotations.summary }}*
        {{ .Annotations.description }}
        
        *Labels:* {{ range .Labels.SortedPairs }}`{{ .Name }}`={{ .Value }} {{ end }}
        *Started:* {{ .StartsAt }}
        {{ if .Annotations.runbook_url }}*Runbook:* <{{ .Annotations.runbook_url }}|View Runbook>{{ end }}
        {{ end }}
        
        <http://grafana:3000/d/robo-rlhf-overview|📊 Dashboard>
      short_fields: true
      
    webhook_configs:
    - url: 'http://pagerduty-webhook:8080/alerts'
      send_resolved: true
      http_config:
        basic_auth:
          username: 'pagerduty'
          password: 'webhook-secret'

  # Training team notifications
  - name: 'training-team'
    email_configs:
    - to: 'ml-team@robo-rlhf.com'
      subject: '[Training] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      body: |
        Training Alert 🤖
        
        {{ range .Alerts }}
        Issue: {{ .Annotations.summary }}
        Details: {{ .Annotations.description }}
        
        Model: {{ .Labels.model_id }}
        GPU: {{ .Labels.gpu_id }}
        Phase: {{ .Labels.phase }}
        
        Started: {{ .StartsAt }}
        {{ end }}
        
        Training Dashboard: http://grafana:3000/d/training-metrics
        
    slack_configs:
    - channel: '#ml-training'
      title: 'Training Alert'
      color: 'warning'
      
  # Infrastructure team notifications  
  - name: 'infrastructure-team'
    email_configs:
    - to: 'infrastructure@robo-rlhf.com'
      subject: '[Infrastructure] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      
    slack_configs:
    - channel: '#infrastructure'
      title: 'Infrastructure Alert'
      
  # Security team notifications
  - name: 'security-team'
    email_configs:
    - to: 'security@robo-rlhf.com'
      subject: '[SECURITY] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      headers:
        Priority: 'high'
        X-Security-Alert: 'true'
      body: |
        🔒 SECURITY ALERT 🔒
        
        {{ range .Alerts }}
        Threat: {{ .Annotations.summary }}
        Details: {{ .Annotations.description }}
        
        Source: {{ .Labels.instance }}
        Type: {{ .Labels.alert_type }}
        Severity: {{ .Labels.severity }}
        
        Time: {{ .StartsAt }}
        {{ end }}
        
        Immediate investigation required.
        Security Dashboard: http://grafana:3000/d/security-overview
        
    slack_configs:
    - channel: '#security-alerts'
      title: '🔒 Security Alert'
      color: 'danger'
      
  # SDLC team notifications
  - name: 'sdlc-team'
    email_configs:
    - to: 'devops@robo-rlhf.com'
      subject: '[SDLC] {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
      
    slack_configs:
    - channel: '#autonomous-sdlc'
      title: 'Autonomous SDLC Alert'
      color: 'warning'
      text: |
        {{ range .Alerts }}
        *{{ .Annotations.summary }}*
        {{ .Annotations.description }}
        
        *Phase:* {{ .Labels.phase }}
        *Component:* {{ .Labels.component }}
        {{ end }}
        
        <http://grafana:3000/d/autonomous-sdlc|📊 SDLC Dashboard>
        
  # Warning alerts - less urgent
  - name: 'warning-alerts'
    email_configs:
    - to: 'warnings@robo-rlhf.com'
      subject: '[Warning] {{ .GroupLabels.alertname }} - {{ len .Alerts }} alerts'
      body: |
        Warning Alert Summary
        
        Total Alerts: {{ len .Alerts }}
        
        {{ range .Alerts }}
        - {{ .Annotations.summary }}
          {{ .Annotations.description }}
          Labels: {{ range .Labels.SortedPairs }}{{ .Name }}={{ .Value }} {{ end }}
        {{ end }}
        
    slack_configs:
    - channel: '#monitoring-warnings'
      title: 'System Warning'
      color: 'warning'

# Templates for reusable message formatting
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Time intervals for muting notifications
time_intervals:
  - name: 'business-hours'
    time_intervals:
    - times:
      - start_time: '09:00'
        end_time: '17:00'
      weekdays: ['monday:friday']
      location: 'UTC'
      
  - name: 'weekends'
    time_intervals:
    - times:
      - start_time: '00:00'
        end_time: '23:59'
      weekdays: ['saturday', 'sunday']
      location: 'UTC'

# Mute rules for planned maintenance
mute_time_intervals:
  - name: 'maintenance-window'
    time_intervals:
    - times:
      - start_time: '02:00'
        end_time: '04:00'
      weekdays: ['sunday']
      location: 'UTC'