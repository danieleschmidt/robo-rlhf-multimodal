apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: robo-rlhf-multimodal
    env: production
    version: 1.0.0
  name: robo-rlhf-production
spec:
  replicas: 5
  selector:
    matchLabels:
      app: robo-rlhf-multimodal
      env: production
  template:
    metadata:
      labels:
        app: robo-rlhf-multimodal
        env: production
    spec:
      containers:
      - env:
        - name: ENVIRONMENT
          value: production
        - name: LOG_LEVEL
          value: INFO
        image: robo-rlhf:latest-production
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        name: robo-rlhf
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          limits:
            cpu: '2'
            memory: 4Gi
          requests:
            cpu: '2'
            memory: 4Gi
