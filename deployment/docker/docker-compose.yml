version:
  3.8
services:
  robo-rlhf-app:
    image:
      robo-rlhf/multimodal:latest
    build:
      context:
        .
      dockerfile:
        Dockerfile
    ports:
      - 8000:8000
      - 8080:8080
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - QUANTUM_OPTIMIZATION_ENABLED=true
      - AUTO_SCALING_ENABLED=true
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart:
      unless-stopped
    deploy:
      replicas:
        5
      resources:
        limits:
          cpus:
            2.0
          memory:
            4G
        reservations:
          cpus:
            0.5
          memory:
            1G
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8000/health
      interval:
        30s
      timeout:
        10s
      retries:
        3
      start_period:
        40s
  prometheus:
    image:
      prom/prometheus:latest
    ports:
      - 9090:9090
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --web.enable-lifecycle
  grafana:
    image:
      grafana/grafana:latest
    ports:
      - 3000:3000
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana-storage:/var/lib/grafana
  redis:
    image:
      redis:7-alpine
    ports:
      - 6379:6379
    command:
      redis-server --appendonly yes
    volumes:
      - redis-data:/data
volumes:
  grafana-storage:
  redis-data:
networks:
  robo-rlhf-network:
    driver:
      bridge
