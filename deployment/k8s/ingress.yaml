apiVersion:
  networking.k8s.io/v1
kind:
  Ingress
metadata:
  name:
    robo-rlhf-ingress
  namespace:
    robo-rlhf
  annotations:
    kubernetes.io/ingress.class:
      nginx
    cert-manager.io/cluster-issuer:
      letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit:
      100
    nginx.ingress.kubernetes.io/ssl-redirect:
      true
spec:
  tls:
    -
      hosts:
        - robo-rlhf-production.example.com
      secretName:
        robo-rlhf-tls
  rules:
    -
      host:
        robo-rlhf-production.example.com
      http:
        paths:
          -
            path:
              /
            pathType:
              Prefix
            backend:
              service:
                name:
                  robo-rlhf-service
                port:
                  number:
                    80
