apiVersion:
  apps/v1
kind:
  Deployment
metadata:
  name:
    robo-rlhf-multimodal
  namespace:
    robo-rlhf
  labels:
    app:
      robo-rlhf-multimodal
    version:
      v1.0.0
    environment:
      production
spec:
  replicas:
    5
  selector:
    matchLabels:
      app:
        robo-rlhf-multimodal
  template:
    metadata:
      labels:
        app:
          robo-rlhf-multimodal
        version:
          v1.0.0
      annotations:
        prometheus.io/scrape:
          true
        prometheus.io/port:
          8080
        prometheus.io/path:
          /metrics
    spec:
      serviceAccountName:
        robo-rlhf-service-account
      securityContext:
        runAsNonRoot:
          True
        runAsUser:
          1001
        fsGroup:
          2000
      containers:
        -
          name:
            robo-rlhf-app
          image:
            robo-rlhf/multimodal:latest
          imagePullPolicy:
            Always
          ports:
            -
              containerPort:
                8000
              name:
                http
              protocol:
                TCP
            -
              containerPort:
                8080
              name:
                metrics
              protocol:
                TCP
          resources:
            requests:
              cpu:
                1000m
              memory:
                2Gi
            limits:
              cpu:
                4000m
              memory:
                8Gi
          env:
            -
              name:
                ENVIRONMENT
              value:
                production
            -
              name:
                LOG_LEVEL
              value:
                INFO
            -
              name:
                METRICS_ENABLED
              value:
                true
          envFrom:
            -
              configMapRef:
                name:
                  robo-rlhf-config
          volumeMounts:
            -
              name:
                data-volume
              mountPath:
                /app/data
            -
              name:
                logs-volume
              mountPath:
                /app/logs
          livenessProbe:
            httpGet:
              path:
                /health
              port:
                8000
            initialDelaySeconds:
              30
            periodSeconds:
              10
            timeoutSeconds:
              5
            failureThreshold:
              3
          readinessProbe:
            httpGet:
              path:
                /ready
              port:
                8000
            initialDelaySeconds:
              10
            periodSeconds:
              5
            timeoutSeconds:
              3
            failureThreshold:
              3
      volumes:
        -
          name:
            data-volume
          persistentVolumeClaim:
            claimName:
              robo-rlhf-data-pvc
        -
          name:
            logs-volume
          emptyDir:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            -
              weight:
                100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    -
                      key:
                        app
                      operator:
                        In
                      values:
                        - robo-rlhf-multimodal
                topologyKey:
                  kubernetes.io/hostname
