global:
  scrape_interval:
    15s
  evaluation_interval:
    15s
alerting:
  alertmanagers:
    -
      static_configs:
        -
          targets:
            - alertmanager:9093
rule_files:
  - alert_rules.yml
scrape_configs:
  -
    job_name:
      robo-rlhf
    static_configs:
      -
        targets:
          - robo-rlhf-app:8080
    scrape_interval:
      5s
    metrics_path:
      /metrics
  -
    job_name:
      kubernetes-pods
    kubernetes_sd_configs:
      -
        role:
          pod
    relabel_configs:
      -
        source_labels:
          - __meta_kubernetes_pod_annotation_prometheus_io_scrape
        action:
          keep
        regex:
          True
