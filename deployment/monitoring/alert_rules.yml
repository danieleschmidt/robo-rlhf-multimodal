groups:
  -
    name:
      robo_rlhf_alerts
    rules:
      -
        alert:
          HighCPUUsage
        expr:
          cpu_usage_percent > 80
        for:
          5m
        labels:
          severity:
            warning
        annotations:
          summary:
            High CPU usage detected
          description:
            CPU usage is above 80% for more than 5 minutes
      -
        alert:
          HighMemoryUsage
        expr:
          memory_usage_percent > 85
        for:
          5m
        labels:
          severity:
            critical
        annotations:
          summary:
            High memory usage detected
          description:
            Memory usage is above 85% for more than 5 minutes
      -
        alert:
          ServiceDown
        expr:
          up == 0
        for:
          1m
        labels:
          severity:
            critical
        annotations:
          summary:
            Service is down
          description:
            Service has been down for more than 1 minute
