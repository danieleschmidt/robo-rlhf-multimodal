[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "robo-rlhf-multimodal"
version = "0.2.0"
description = "Multimodal RLHF pipeline for robotics — image + proprioception with human preference learning"
authors = [{name = "Daniel Schmidt"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["robo_rlhf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
